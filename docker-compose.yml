x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    MYSQL_HOST: mysql
    REDIS_URL: redis://redis:6379/0
    EMBEDDING_CACHE_DIR: /models
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-newsdigest}
      MYSQL_USER: ${MYSQL_USER:-newsdigest}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-newsdigest}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  worker:
    <<: *backend
    command: ["arq", "app.worker.main.WorkerSettings"]
    volumes:
      - model_cache:/models
    depends_on:
      api:
        condition: service_healthy

  bot:
    <<: *backend
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  model_cache:
